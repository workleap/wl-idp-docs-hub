name: Lockfile
on:
    pull_request:
        branches: ["main"]
    push:
        branches: ["main"]

permissions:
    contents: read

jobs:
    check:
        name: Check the lockfile

        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Check that the lockfile has no tarball URLs
              # pnpm downloads a package from the tarball URL recorded in the lockfile, bypassing the GitHub
              # package firewall configured in .npmrc. The .pnpmfile.cjs file removes the registry.npmjs.org
              # URLs pnpm writes when resolving through the firewall; a URL left in the lockfile was written
              # without the pnpmfile (e.g. with --ignore-pnpmfile or before the pnpmfile was added).
              run: |
                  if grep -n "tarball:" pnpm-lock.yaml; then
                    echo "::error file=pnpm-lock.yaml::The lockfile contains tarball URLs. Run \"pnpm install --fix-lockfile\" and commit pnpm-lock.yaml. See README.md."
                    exit 1
                  fi
